name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: run golangci-lint
        run: go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64 run ./...

  test:
    name: Test (Go 1.26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 ./...
