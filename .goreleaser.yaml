# goreleaser 配置 — 交叉编译 + 打包 + GitHub Release
# 触发：git tag v1.0.0 && git push --tags
version: 2

builds:
  - main: ./cmd/pg
    binary: pg
    goos: [darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}
    env:
      - CGO_ENABLED=0

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE

checksum:
  name_template: 'checksums.txt'

# changelog 从 commit 自动生成简要列表（Release 底部附注）
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

release:
  draft: false
  prerelease: auto
  # Release 正文引用 version-log 文件（从 change-log 总结的版本发布说明）
  header: |
    {{ if .HasHeaderFile }}## 发版说明
    {{ .HeaderContent }}

    {{ end }}
  header_file: version-log/{{ trimprefix .Version "v" }}.md
  footer: |
    ---

    ## 安装

    ```bash
    # macOS (Apple Silicon)
    curl -fsSL https://raw.githubusercontent.com/Effortful-lion/pi-go/main/install.sh | bash

    # 或 go install
    go install github.com/Effortful-lion/pi-go/cmd/pg@{{ .Version }}
    ```
